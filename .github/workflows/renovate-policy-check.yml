name: Renovate Automerge Policy Check

# Enforces tuna-os/.github#12 against this repo's own renovate.json: a
# syntactically valid config can still automerge major updates once
# packageRules are layered (see tunaOS#1612, tunaOS#1636) — the schema
# validator alone would not have caught that.

on:
  push:
    branches: [main]
    paths:
      - "renovate.json"
      - "default.json"
      - "project-starter/renovate.json"
      - "scripts/check-renovate-automerge-policy.py"
      - "scripts/test-renovate-automerge-policy.py"
  pull_request:
    branches: [main]
    paths:
      - "renovate.json"
      - "default.json"
      - "project-starter/renovate.json"
      - "scripts/check-renovate-automerge-policy.py"
      - "scripts/test-renovate-automerge-policy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # project-starter/renovate.json as well as this repo's own. The
      # template is copied verbatim into every scaffolded repo, so a policy
      # violation there propagates to repos that will never run this check --
      # which makes it the copy that matters most, and the one that was not
      # being checked.
      - name: Check Renovate automerge policy
        run: |
          python3 scripts/check-renovate-automerge-policy.py default.json
          python3 scripts/check-renovate-automerge-policy.py renovate.json
          python3 scripts/check-renovate-automerge-policy.py project-starter/renovate.json
      # The gate's own blocked set was narrowed to {major}; these cases pin
      # that boundary so it cannot erode further unnoticed.
      - name: Policy checker self-test
        run: python3 scripts/test-renovate-automerge-policy.py
